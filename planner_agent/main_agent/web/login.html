<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner Agent — Sign In</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f7fb;
    --panel: #ffffff;
    --line: #e0e5ee;
    --muted: #6b7787;
    --text: #1a1f2c;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --red-500: #ef4444;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 40px 36px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  .logo {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -.01em;
    color: var(--text);
    margin-bottom: 6px;
  }
  .tagline {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 28px;
  }
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }
  .tab {
    padding: 8px 0;
    margin-right: 20px;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
  }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .form-group { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--text);
  }
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 14px;
    color: var(--text);
    background: #fff;
    outline: none;
    transition: border-color .15s;
  }
  input:focus { border-color: var(--accent); }
  .btn {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background .15s;
  }
  .btn:hover { background: var(--accent-hover); }
  .error {
    font-size: 13px;
    color: var(--red-500);
    margin-bottom: 14px;
    display: none;
  }
  .error.visible { display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Planner Agent</div>
  <div class="tagline">Sign in with your @wustl.edu account</div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('login')">Sign in</button>
    <button class="tab" onclick="showTab('signup')">Create account</button>
  </div>

  <div id="error-msg" class="error"></div>

  <!-- Login form -->
  <form id="login-form" action="/auth/login" method="post">
    <div class="form-group">
      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" autocomplete="email"
             placeholder="you@wustl.edu" required>
    </div>
    <div class="form-group">
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Sign in</button>
  </form>

  <!-- Signup form -->
  <form id="signup-form" action="/auth/signup" method="post" style="display:none">
    <div class="form-group">
      <label for="signup-email">Email</label>
      <input id="signup-email" name="email" type="email" autocomplete="email"
             placeholder="you@wustl.edu" required>
    </div>
    <div class="form-group">
      <label for="signup-password">Password</label>
      <input id="signup-password" name="password" type="password" autocomplete="new-password"
             placeholder="At least 8 characters" required minlength="8">
    </div>
    <button class="btn" type="submit">Create account</button>
  </form>
</div>

<script>
  function showTab(name) {
    document.getElementById('login-form').style.display  = name === 'login'  ? '' : 'none';
    document.getElementById('signup-form').style.display = name === 'signup' ? '' : 'none';
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', (i === 0) === (name === 'login'));
    });
    document.getElementById('error-msg').classList.remove('visible');
  }

  // Surface server errors passed via query param (set by middleware on redirect)
  const params = new URLSearchParams(location.search);
  const err = params.get('error');
  if (err) {
    const el = document.getElementById('error-msg');
    el.textContent = decodeURIComponent(err);
    el.classList.add('visible');
  }
  const tab = params.get('tab');
  if (tab === 'signup') showTab('signup');
</script>
</body>
</html>
