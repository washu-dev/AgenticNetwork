# Offline test gates: per-component unit suites, repo hygiene, and the native
# full-chain pipeline test. Nothing here needs Docker, Postgres, a real dirctl,
# network services or API keys. Both test jobs run `scripts/stack test`
# (devstack/suites.py), the same command as locally.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash  # explicit shell = bash -eo pipefail

jobs:
  unit:
    name: unit (${{ matrix.label || matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python versions follow each component's Docker image / packaging.
          - component: chat_app
            python: "3.13"
            deps: chat_app/requirements.txt
            install: pip install -r chat_app/requirements.txt
          - component: registration_service
            python: "3.11"
            deps: registration_service/requirements.txt
            # Run from the repo root: the file's "-e ./agent_skeleton" is CWD-relative.
            install: pip install -r registration_service/requirements.txt
          - component: agent_skeleton
            python: "3.11"
            deps: agent_skeleton/pyproject.toml
            install: pip install -e ./agent_skeleton pytest
          # agentnet runs inside both services, so its tests run in each service's
          # environment: registration's (a2a-sdk 0.3.2) and the chat app's (0.3.26).
          # dirctl is mocked.
          - component: agentnet
            label: agentnet, a2a-sdk 0.3.2
            python: "3.11"
            deps: registration_service/requirements.txt
            install: pip install -r registration_service/requirements.txt
          - component: agentnet
            label: agentnet, a2a-sdk 0.3.26
            python: "3.13"
            deps: chat_app/requirements.txt
            install: pip install -r chat_app/requirements.txt
          - component: devstack
            python: "3.11"
            deps: registration_service/requirements.txt
            # Standard library plus the openai SDK (mock LLM test) and lsof (stack tests).
            install: |
              pip install -r registration_service/requirements.txt
              command -v lsof >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q lsof; }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.deps }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install }}
          python -m pip install pytest-cov==7.1.0
      # --python: this job's interpreter instead of the repo venvs (so agentnet runs once
      # per job). --cov then prints line coverage of the component's own code (its tests
      # left out); report only, no threshold. The suite gets a clean environment, with
      # plugin autoload on (registration needs pytest-asyncio; coverage needs pytest-cov);
      # registration_service/tests/conftest.py sets FAKE_DB=1 itself.
      - name: Test
        run: scripts/stack test "${{ matrix.component }}" --python "$(command -v python)" --cov

  hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No tracked files that .gitignore excludes
        run: |
          ignored=$(git ls-files -ci --exclude-standard)
          if [ -n "$ignored" ]; then
            echo "::error::Tracked files match .gitignore rules (git rm --cached them):"
            echo "$ignored"
            exit 1
          fi
      - name: No forbidden tracked file types
        run: |
          # Secrets, keys, credential/token files, model weights, slide decks, local
          # databases, logs and packaging output. *.example templates (e.g.
          # .env.example, secrets.env.example) are allowed.
          types='\.(pt|pth|safetensors|gguf|onnx|ckpt|pptx|sqlite3?|db|pem|key|p12|whl|log)$'
          types+='|(^|/)\.env(\.[^/]+)?$|(^|/)[^/]*secrets[^/]*\.env$|(^|/)env\.local$'
          types+='|(^|/)[^/]*(credentials|service-account)[^/]*\.json$|(^|/)token\.json$'
          # Personal and dev-stack state, build output and runtime uploads: nothing at all.
          paths='^(Local|\.devstack[^/]*|dist)/|(^|/)uploaded_handlers/'
          bad=$({ git ls-files | grep -E "$types" | grep -vE '\.example$'
                  git ls-files | grep -E "$paths"; } | sort -u || true)
          if [ -n "$bad" ]; then
            echo "::error::Forbidden file types are tracked:"
            echo "$bad"
            exit 1
          fi
      - name: No tracked file over 1 MB
        run: |
          big=$(git ls-tree -r -l HEAD \
            | awk -F'\t' '{ split($1, m, " "); if (m[4] != "-" && m[4] + 0 > 1048576) print m[4] " bytes  " $2 }')
          if [ -n "$big" ]; then
            echo "::error::Tracked files larger than 1 MB:"
            echo "$big"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # PIPELINE (tier 1, native): the full-chain test and the scenario tests
  # (tests/pipeline, Goal 1 in docs/OPEN_SOURCE_RELEASE.md). Each starts the dev
  # stack with `scripts/stack up` and drives it over HTTP only. Services run as
  # local processes from the two venvs below (chat app on a2a-sdk 0.3.26;
  # registration and the agents it spawns on 0.3.2); `scripts/stack test` runs
  # the tests themselves from the registration venv.
  # ---------------------------------------------------------------------------
  pipeline:
    name: pipeline (full chain, native)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            chat_app/requirements.txt
            registration_service/requirements.txt
      - name: Create service venvs
        run: |
          python -m venv chat_app/.venv
          chat_app/.venv/bin/python -m pip install --upgrade pip
          chat_app/.venv/bin/python -m pip install -r chat_app/requirements.txt
          python -m venv registration_service/.venv
          registration_service/.venv/bin/python -m pip install --upgrade pip
          # From the repo root: the file's "-e ./agent_skeleton" is CWD-relative.
          registration_service/.venv/bin/python -m pip install -r registration_service/requirements.txt
      - name: Install lsof
        # `scripts/stack down` uses lsof to find leftover agents.
        run: command -v lsof >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q lsof; }
      - name: Doctor
        run: scripts/stack doctor
      - name: Pipeline tests
        # The full chain (ports +20000, state dir .devstack-pipeline), then the scenarios
        # (+20100, .devstack-scenarios), each on a fresh stack of its own, so a full-chain
        # failure keeps its logs and the scenarios still run. Each file is stopped after
        # 600 s; this step timeout is a backstop, below the job's, so the logs below still
        # upload after a hang.
        timeout-minutes: 25
        run: scripts/stack test pipeline
      - name: Upload dev stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          # Service, agent and mock-LLM request logs from the two state dirs above.
          path: |
            .devstack-pipeline/logs/
            .devstack-scenarios/logs/
          if-no-files-found: ignore
          include-hidden-files: true  # the state dirs are dot-dirs
          retention-days: 7
