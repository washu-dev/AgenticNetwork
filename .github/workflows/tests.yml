# Offline test gates: per-component unit suites, repo hygiene, and the native
# full-chain pipeline test. Nothing here needs Docker, Postgres, a real dirctl,
# network services or API keys.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash  # explicit shell = bash -eo pipefail

jobs:
  unit:
    name: unit (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python versions follow each component's Docker image / packaging.
          - component: planner_agent
            python: "3.13"
            deps: planner_agent/requirements.txt
            install: pip install -r planner_agent/requirements.txt
          - component: registration_service
            python: "3.11"
            deps: registration_service/requirements.txt
            # Run from the repo root: the file's "-e ./agent_skeleton" is CWD-relative.
            install: pip install -r registration_service/requirements.txt
          - component: agent_skeleton
            python: "3.11"
            deps: agent_skeleton/pyproject.toml
            install: pip install -e ./agent_skeleton pytest
          - component: agent_directory_service
            python: "3.12"
            deps: agent_directory_service/requirements.txt
            # Only what the tests import (a2a, pydantic, pytest; dirctl is mocked).
            # Its requirements.txt needs the buf.build extra index for agntcy-*, which
            # the tests never import, so CI does not depend on that index.
            install: pip install a2a-sdk==0.3.2 pydantic==2.12.5 pytest==9.0.3
          - component: devstack
            python: "3.11"
            deps: registration_service/requirements.txt
            # Standard library plus the openai SDK (mock LLM test) and lsof (stack tests).
            install: |
              pip install -r registration_service/requirements.txt
              command -v lsof >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q lsof; }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.deps }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install }}
      # No PYTEST_DISABLE_PLUGIN_AUTOLOAD: registration needs the pytest-asyncio plugin.
      # registration_service/tests/conftest.py sets FAKE_DB=1 itself.
      - name: Test
        run: python -m pytest "${{ matrix.component }}/tests" -q -p no:cacheprovider

  hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No tracked files that .gitignore excludes
        run: |
          ignored=$(git ls-files -ci --exclude-standard)
          if [ -n "$ignored" ]; then
            echo "::error::Tracked files match .gitignore rules (git rm --cached them):"
            echo "$ignored"
            exit 1
          fi
      - name: No forbidden tracked file types
        run: |
          # Secrets, keys, credential/token files, model weights, slide decks, local
          # databases, logs and packaging output. *.example templates (e.g.
          # .env.example, secrets.env.example) are allowed.
          types='\.(pt|pth|safetensors|gguf|onnx|ckpt|pptx|sqlite3?|db|pem|key|p12|whl|log)$'
          types+='|(^|/)\.env(\.[^/]+)?$|(^|/)[^/]*secrets[^/]*\.env$|(^|/)env\.local$'
          types+='|(^|/)[^/]*(credentials|service-account)[^/]*\.json$|(^|/)token\.json$'
          # Personal and dev-stack state, build output and runtime uploads: nothing at all.
          paths='^(Local|\.devstack[^/]*|dist)/|(^|/)uploaded_handlers/'
          bad=$({ git ls-files | grep -E "$types" | grep -vE '\.example$'
                  git ls-files | grep -E "$paths"; } | sort -u || true)
          if [ -n "$bad" ]; then
            echo "::error::Forbidden file types are tracked:"
            echo "$bad"
            exit 1
          fi
      - name: No tracked file over 1 MB
        run: |
          big=$(git ls-tree -r -l HEAD \
            | awk -F'\t' '{ split($1, m, " "); if (m[4] != "-" && m[4] + 0 > 1048576) print m[4] " bytes  " $2 }')
          if [ -n "$big" ]; then
            echo "::error::Tracked files larger than 1 MB:"
            echo "$big"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # PIPELINE (tier 1, native): the full-chain test (tests/pipeline, Goal 1 in
  # docs/OPEN_SOURCE_RELEASE.md). It starts the dev stack with `scripts/stack up`
  # and drives it over HTTP only. Services run as local processes from the two
  # venvs below (planner on a2a-sdk 0.3.26; registration and the agents it
  # spawns on 0.3.2); the test runner itself needs only pytest.
  # ---------------------------------------------------------------------------
  pipeline:
    name: pipeline (full chain, native)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            planner_agent/requirements.txt
            registration_service/requirements.txt
      - name: Create service venvs
        run: |
          python -m venv planner_agent/.venv
          planner_agent/.venv/bin/python -m pip install --upgrade pip
          planner_agent/.venv/bin/python -m pip install -r planner_agent/requirements.txt
          python -m venv registration_service/.venv
          registration_service/.venv/bin/python -m pip install --upgrade pip
          # From the repo root: the file's "-e ./agent_skeleton" is CWD-relative.
          registration_service/.venv/bin/python -m pip install -r registration_service/requirements.txt
      - name: Install test runner
        run: |
          python -m pip install pytest==9.0.3
          # `scripts/stack down` uses lsof to find leftover agents.
          command -v lsof >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q lsof; }
      - name: Doctor
        run: scripts/stack doctor
      - name: Full-chain test
        # A hang fails this step (not the whole job), so the logs below still upload.
        timeout-minutes: 10
        env:
          PIPELINE_PORT_OFFSET: "20000"
          PIPELINE_STATE_DIR: ${{ github.workspace }}/.devstack-pipeline
        run: python -m pytest tests/pipeline -q -p no:cacheprovider
      - name: Upload dev stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          # Service, agent and mock-LLM request logs from PIPELINE_STATE_DIR above.
          path: .devstack-pipeline/logs/
          if-no-files-found: ignore
          include-hidden-files: true  # .devstack-pipeline/ is a dot-dir
          retention-days: 7
