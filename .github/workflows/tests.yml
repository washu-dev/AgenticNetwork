# Offline test gates: every component's unit suite, repo hygiene, and the native
# full-chain pipeline test. Nothing here needs Docker, Postgres, a real dirctl,
# network services or API keys. The unit and pipeline jobs install requirements-dev.txt
# (the one dev environment) and run `scripts/stack test` (devstack/suites.py), as locally;
# the image-deps jobs run some suites with only what an image installs.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash  # explicit shell = bash -eo pipefail

jobs:
  unit:
    name: unit (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The images' two Pythons: 3.13 for the chat app, 3.11 for the registration
        # service and the agent images. Every suite runs on both.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            chat_app/requirements.txt
            registration_service/requirements.txt
      - name: Install
        # From the repo root: registration's "-e ./agent_skeleton" is CWD-relative.
        # lsof: devstack's process tests.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          command -v lsof >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q lsof; }
      # --python: this job's interpreter instead of the dev venv. --cov then prints line
      # coverage of each component's own code (its tests left out); report only, no
      # threshold. Each suite gets a clean environment, with plugin autoload on
      # (registration needs pytest-asyncio; coverage needs pytest-cov);
      # registration_service/tests/conftest.py sets FAKE_DB=1 itself.
      - name: Test
        # The five suites run one after the other, each stopped after 180 s (the slowest
        # takes about 30 s), then killed 60 s later if it ignores SIGTERM: at most
        # 5 x (180 + 60) s = 20 min. This step timeout is a backstop above that and below
        # the job's, so a hung suite is stopped and reported, and the rest still run.
        timeout-minutes: 22
        run: scripts/stack test unit --python "$(command -v python)" --cov --timeout 180

  # The unit job tests the dev venv's versions. Each image installs only its own
  # requirements, whose versions float (registration's file has only minimums, and
  # agent_skeleton's openai and uvicorn too), so these jobs run the suites an image's
  # code needs with only what that image installs.
  image-deps:
    name: unit, ${{ matrix.label }} deps (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # A built agent image installs agent_skeleton alone: its runtime must need
          # nothing else.
          - label: agent image
            deps: agent_skeleton/pyproject.toml
            install: python -m pip install -e ./agent_skeleton pytest pytest-cov==7.1.0
            suites: agent_skeleton
          # Dockerfile.registration: registration_service/requirements.txt alone (from the
          # repo root: its "-e ./agent_skeleton" is CWD-relative). agentnet runs inside it.
          - label: registration image
            deps: registration_service/requirements.txt
            install: python -m pip install -r registration_service/requirements.txt pytest-cov==7.1.0
            suites: registration_service agent_skeleton agentnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.deps }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install }}
      - name: Test
        # As in the unit job: at most 3 x (180 + 60) s = 12 min, under this step timeout.
        timeout-minutes: 14
        run: scripts/stack test ${{ matrix.suites }} --python "$(command -v python)" --cov --timeout 180

  hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No tracked files that .gitignore excludes
        run: |
          ignored=$(git ls-files -ci --exclude-standard)
          if [ -n "$ignored" ]; then
            echo "::error::Tracked files match .gitignore rules (git rm --cached them):"
            echo "$ignored"
            exit 1
          fi
      - name: No forbidden tracked file types
        run: |
          # Secrets, keys, credential/token files, model weights, slide decks, local
          # databases, logs and packaging output. *.example templates (e.g.
          # .env.example, secrets.env.example) are allowed.
          types='\.(pt|pth|safetensors|gguf|onnx|ckpt|pptx|sqlite3?|db|pem|key|p12|whl|log)$'
          types+='|(^|/)\.env(\.[^/]+)?$|(^|/)[^/]*secrets[^/]*\.env$|(^|/)env\.local$'
          types+='|(^|/)[^/]*(credentials|service-account)[^/]*\.json$|(^|/)token\.json$'
          # Personal and dev-stack state, build output and runtime uploads: nothing at all.
          paths='^(Local|\.devstack[^/]*|dist)/|(^|/)uploaded_handlers/'
          bad=$({ git ls-files | grep -E "$types" | grep -vE '\.example$'
                  git ls-files | grep -E "$paths"; } | sort -u || true)
          if [ -n "$bad" ]; then
            echo "::error::Forbidden file types are tracked:"
            echo "$bad"
            exit 1
          fi
      - name: No tracked file over 1 MB
        run: |
          big=$(git ls-tree -r -l HEAD \
            | awk -F'\t' '{ split($1, m, " "); if (m[4] != "-" && m[4] + 0 > 1048576) print m[4] " bytes  " $2 }')
          if [ -n "$big" ]; then
            echo "::error::Tracked files larger than 1 MB:"
            echo "$big"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # PIPELINE (tier 1, native): the full-chain test and the scenario tests
  # (tests/pipeline, Goal 1 in docs/OPEN_SOURCE_RELEASE.md). Each starts the dev
  # stack with `scripts/stack up` and drives it over HTTP only. The services (and
  # the agents registration spawns with its own interpreter) and the tests themselves
  # all run from the dev venv below (a2a-sdk 0.3.2).
  # ---------------------------------------------------------------------------
  pipeline:
    name: pipeline (full chain, native)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            chat_app/requirements.txt
            registration_service/requirements.txt
      - name: Create the dev venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # From the repo root: registration's "-e ./agent_skeleton" is CWD-relative.
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Install lsof
        # `scripts/stack down` uses lsof to find leftover agents.
        run: command -v lsof >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q lsof; }
      - name: Doctor
        run: scripts/stack doctor
      - name: Pipeline tests
        # The full chain (ports +20000, state dir .devstack-pipeline), then the scenarios
        # (+20100, .devstack-scenarios), each on a fresh stack of its own, so a full-chain
        # failure keeps its logs and the scenarios still run. Each file is stopped after
        # 600 s; this step timeout is a backstop, below the job's, so the logs below still
        # upload after a hang.
        timeout-minutes: 25
        run: scripts/stack test pipeline
      - name: Upload dev stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          # Service, agent and mock-LLM request logs from the two state dirs above.
          path: |
            .devstack-pipeline/logs/
            .devstack-scenarios/logs/
          if-no-files-found: ignore
          include-hidden-files: true  # the state dirs are dot-dirs
          retention-days: 7
