# Tier 2: build the service images and run the Docker Compose stack (real Postgres,
# real dirctl daemon, mock LLM) through deployment/compose/smoke.sh, including a
# restart that must keep the saved conversation. Slower than tests.yml, so it runs
# only when deployment or service code changes, weekly, or by hand.
name: compose

on:
  pull_request:
    paths:
      - "deployment/**"
      - "devstack/**"
      - "planner_agent/**"
      - "registration_service/**"
      - "agent_skeleton/**"
      - "ads_utils/**"
      - ".github/workflows/compose.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: deployment/compose

jobs:
  compose-tier2:
    name: compose smoke (tier 2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up -d --build && docker compose run --rm seed
      - name: Smoke, restart, smoke again
        run: |
          ./smoke.sh | tee first.txt
          cid=$(sed -n 's/^  context_id: //p' first.txt)
          test -n "$cid"
          docker compose down && docker compose up -d && docker compose run --rm seed
          ./smoke.sh --expect-conversation "$cid"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
