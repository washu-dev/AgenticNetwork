# ADS daemon config for a standalone GCP VM (Phase 2 of the GCP migration).
#
# Adapted from deployment/ads_daemon.yaml. Two changes for a single always-on VM
# that runs ONLY the directory (no companion Postgres container):
#   - database.type: "postgres" -> "sqlite"  — the VM runs just the daemon + a local
#     OCI registry; sqlite avoids standing up a separate Postgres. (Prod's multi-
#     container stack uses Postgres to dodge SQLITE_BUSY on simultaneous cold-start;
#     a lone VM under light directory load doesn't hit that.)
#   - listen_address stays 0.0.0.0:8888 (already correct here) so the Cloud Run
#     planner can reach it over the VPC connector.
# Run with host networking so `localhost:5000` resolves to the co-located registry:
#   docker run -d --name oci-registry --restart unless-stopped -p 5000:5000 registry:2
#   docker run -d --name ads --restart unless-stopped --network host \
#     -v /var/lib/ads:/var/lib/ads \
#     -v $PWD/ads_daemon.gcp.yaml:/app/ads_daemon.yaml \
#     di2washu/agenticnetwork-ads:latest

server:
  listen_address: "0.0.0.0:8888"
  oasf_api_validation:
    schema_url: "https://schema.oasf.outshift.com"
  store:
    provider: "oci"
    oci:
      local_dir: "/var/lib/ads/store"
      registry_address: "localhost:5000"
      repository_name: "dir"
  verification:
    enabled: true
  routing:
    listen_address: "/ip4/0.0.0.0/tcp/8999"
    key_path: "/var/lib/ads/node.key"
    datastore_dir: "/var/lib/ads/routing"
    gossipsub:
      enabled: true
  database:
    type: "sqlite"
    sqlite:
      path: "/var/lib/ads/dir.db"
  publication:
    scheduler_interval: 5s
    worker_count: 1
    worker_timeout: 30m
  naming:
    ttl: 168h

reconciler:
  regsync:
    enabled: false
  indexer:
    enabled: true
    interval: 5s
  signature:
    enabled: true
    interval: 1m
    ttl: 168h
    record_timeout: 30s
  name:
    enabled: true
    interval: 1h
    ttl: 168h
    record_timeout: 30s

runtime:
  enabled: false
  adapter:
    type: "docker"
    docker:
      host: "unix:///var/run/docker.sock"
      host_mode: true
    kubernetes:
      kubeconfig: "~/.kube/config"
  resolver:
    a2a:
      enabled: true
    oasf:
      enabled: true
  store:
    type: "sqlite"
