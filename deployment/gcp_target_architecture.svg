<svg width="680" height="776" viewBox="0 0 680 776" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fully-migrated AgenticNetwork architecture on GCP</title>
<desc>Browser reaches a WashU SSO gateway that forwards to a control plane on Cloud Run (ADS directory, Planner, Registration). The planner and registration service drive a generic on-demand agent tier whose backend is chosen per card: most agents run as scale-to-zero Cloud Run services, while agents needing a GPU or strict isolation run on GKE. Shared services sit below: the LLM is primarily a self-hosted vLLM (gpt-oss-120b) on the WashU ENGR cluster, reached from GCP through an always-on relay VM holding an autossh tunnel, over a Serverless VPC Access connector; Vertex AI managed Gemini is a deferred backup reached by a base-URL flip. Plus Cloud SQL for Postgres, Secret Manager, a shared external Docker Hub for images, and VPC networking.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="776" fill="#FFFFFF"/>

