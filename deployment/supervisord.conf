[supervisord]
nodaemon=true
logfile=/engrfs/project/di2/AgenticNetwork/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisor/supervisord.pid

[unix_http_server]
file=/var/run/supervisor/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ─────────────────────────────────────────────────────────────────────────────
; Planner (main orchestrator) — port 8090
; ─────────────────────────────────────────────────────────────────────────────
[program:planner]
command=/opt/conda/envs/planner-agent/bin/python -m planner_agent.scripts.run_server --host 0.0.0.0 --port %(ENV_MAIN_AGENT_PORT)s
directory=/app
environment=PYTHONPATH="/app"
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/engrfs/project/di2/AgenticNetwork/logs/planner.log
stdout_logfile_maxbytes=20MB
stderr_logfile=/engrfs/project/di2/AgenticNetwork/logs/planner.err
stderr_logfile_maxbytes=20MB

; ─────────────────────────────────────────────────────────────────────────────
; Scout agent — port 9104
; ─────────────────────────────────────────────────────────────────────────────
[program:scout]
command=/opt/conda/envs/scout-agent/bin/python -m scout serve
    --http-host 0.0.0.0
    --http-port %(ENV_SCOUT_HTTP_PORT)s
directory=/app/scout_agent
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/engrfs/project/di2/AgenticNetwork/logs/scout.log
stdout_logfile_maxbytes=20MB
stderr_logfile=/engrfs/project/di2/AgenticNetwork/logs/scout.err
stderr_logfile_maxbytes=20MB

; ─────────────────────────────────────────────────────────────────────────────
; Email agent — port 9103
; ─────────────────────────────────────────────────────────────────────────────
[program:email]
command=/opt/conda/envs/email-agent-a2a/bin/python email_agent.py
    serve-a2a
    --host 0.0.0.0
    --port %(ENV_EMAIL_AGENT_A2A_PORT)s
directory=/app/email_agent
