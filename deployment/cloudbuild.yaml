# Build one infrastructure image in Google Cloud Build and push it to Artifact Registry.
# No local Docker needed. Run from the repo root (the upload skips .gitignore'd files):
#
#   gcloud builds submit --config=deployment/cloudbuild.yaml \
#     --substitutions=_COMPONENT=chat-app,_TAG=$(git rev-parse --short HEAD) .
#
# Leave out --region: in di2-agenticweb a regional build (--region=us-central1) is refused with
# PERMISSION_DENIED, while the default global build works (2026-11-16).
#
# _COMPONENT picks deployment/dockerfiles/Dockerfile.<component> (chat-app, registration, ads,
# postgres). The image is pushed as both :<_TAG> and :latest under
# <_REGION>-docker.pkg.dev/<project>/<_REPO>/agenticnetwork-<component>.
substitutions:
  _COMPONENT: chat-app
  _TAG: manual
  _REGION: us-central1
  _REPO: agenticnetwork

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deployment/dockerfiles/Dockerfile.${_COMPONENT}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/agenticnetwork-${_COMPONENT}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/agenticnetwork-${_COMPONENT}:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/agenticnetwork-${_COMPONENT}:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/agenticnetwork-${_COMPONENT}:latest

options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
