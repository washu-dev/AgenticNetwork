name: intelligence-agent-a2a
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip>=24
  - pip:
      # OASF SDK packages are hosted on the buf.build registry.
      - --extra-index-url=https://buf.build/gen/python

      # A2A / AGNTCY network runtime (matches AgenticNetwork/v1_classification).
      - fastapi>=0.115.0
      - uvicorn[standard]>=0.32.0
      - aiohttp>=3.11.0
      - pydantic>=2.11.3
      - pydantic-settings>=2.7.0
      - nats-py>=2.6.0
      - a2a-sdk==0.3.2
      - agntcy-app-sdk==0.4.6
      - agntcy-dir>=0.6.0
      - agntcy-oasf-sdk-grpc-python
      - agntcy-oasf-sdk-protocolbuffers-python

      # Utilities used by the v2 network scripts and endpoint validator.
      - httpx>=0.25.0
      - pytest>=7.4.0
      - pytest-asyncio>=0.21.0
      - python-multipart>=0.0.6
      - python-dotenv>=1.0.0

      # Intelligence-agent runtime: LLM client (litellm), no mini-swe-agent.
      - litellm>=1.55.0
