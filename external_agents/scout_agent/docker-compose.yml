# Optional local AGNTCY directory daemon for offline development.
#
# Use this when you don't have access to a shared directory peer (e.g. a lab
# server). It runs `dirctl daemon start` — a single process bundling the
# gRPC apiserver and reconciler with embedded SQLite + a local OCI store.
#
# When pointed at a real shared directory, this file isn't needed; just set
# DIRECTORY_ENDPOINT=<host>:<port> in .env.
#
# Usage:
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f
#   docker compose down

services:
  dir:
    image: ghcr.io/agntcy/dir-ctl:v1.2.0
    container_name: scout-dir
    # Bind to 0.0.0.0 so the host can reach it; the daemon defaults to localhost only.
    environment:
      DIRECTORY_DAEMON_SERVER_LISTEN_ADDRESS: 0.0.0.0:8888
    # Host port 8889 → container 8888. Change the host side if 8889 is taken.
    ports:
      - "8889:8888"
    # Bind-mount a local dir owned by the container's `nonroot` user (UID 65532)
    # so the daemon can persist its identity key + SQLite store across restarts.
    # First run may need: chmod 777 ./infra/dir-data
    volumes:
      - ./infra/dir-data:/home/nonroot/.agntcy/dir
    command: ["daemon", "start"]
    restart: unless-stopped
