[project]
name = "scout"
version = "0.1.0"
description = "OSINT research & trend analysis agent (Phase 1 standalone)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "agntcy-app-sdk>=0.5.0",
    "a2a-sdk>=0.3.20",
]

[project.scripts]
scout = "scout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scout*"]
